<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTVN 7</title>
</head>

<body>

    <h1>Sở thích của bạn</h1>
    <form action="https://google.com" method="get">
        <label for="name">Họ và tên</label>
        <input type="text" name="name" id="name"><br>
        <label for="email">Email</label>
        <input type="email" name="email" id="email"><br>
        <label>Sở thích</label>
        <input type="checkbox" id="sport" name="sport" value="sport">
        <label for="sport">Thể thao</label>
        <input type="checkbox" id="music" name="music" value="music">
        <label for="music">Âm nhạc</label>
        <input type="checkbox" id="read" name="read" value="read">
        <label for="read">Đọc sách</label><br>
        <input type="checkbox" id="web" name="web" value="web">
        <label for="web">Lướt web</label>
        <input type="checkbox" id="game" name="game" value="game">
        <label for="game">Chơi game</label>
        <input type="checkbox" id="movie" name="movie" value="movie">
        <label for="movie">Điện ảnh</label><br>
        <input type="checkbox" id="travel" name="travel" value="travel">
        <label for="travel">Du lịch</label><br>
        <button type="submit">Gửi thông tin</button>
        <button type="reset">Nhập lại</button>
    </form>
</body>

</html>
