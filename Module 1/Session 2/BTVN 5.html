<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <p><b>bài 1:</b> Tạo bảng có chứa thông tin sản phảm trong cửa hàng của bạn:</p>
    <h1>My Store</h1>
    <table border="1px">
        <thead>
            <tr>
                <td>Item Photo</td>
                <td>Name</td>
                <td>Price</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><img src="" alt="Đây là hình trái cam" /></td>
                <td>Oranges</td>
                <td>&dollar;1 ea.</td>
            </tr>
            <tr>
                <td><img src="" alt="Đây là hình trái chuối" /></td>
                <td>Bananas</td>
                <td>&dollar;0.75/lb</td>
            </tr>
            <tr>
                <td><img src="" alt="Đây là trái lựu" /></td>
                <td>Pomegranates</td>
                <td>3for &dollar;5</td>
            </tr>
            <tr>
                <td><img src="" alt="Đây là kẹo dẻo" /></td>
                <td>Gummy Bears</td>
                <td>&dollar;6 per bag</td>
            </tr>
            <tr>
                <td><img src="" alt="Đây là bông cải xanh" /></td>
                <td>Broccoli</td>
                <td>&dollar;3 a head</td>
            </tr>
        </tbody>
    </table>
    <p><b>bài 2:</b> Tạo form đặt phòng khách sạn:</p>
    <h1>Booking Form</h1>
    <form action="https://google.com" method="post">
        <label for="name">Name: </label>
        <input type="text" id="name" name="name" /><br />
        <label for="email">Email: </label>
        <input type="email" id="email" name="email" /><br />
        <label for="tel">Phone: </label>
        <input type="tel" id="tel" name="tel" /><br />
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" /><br />
        <label for="time">Time</label>
        <input type="time" id="time" name="time" /><br />
        <label for="number">Number of Guests</label>
        <input type="number" id="number" name="number" /><br />
        <button type="submit">Submit</button>
    </form>
    <p><b>bài 3:</b> Tạo form mua xe:</p>
    <h1>Car Purchase Form</h1>
    <form action="https://google.com" method="post">
        <label for="2name">Name: </label>
        <input type="text" id="2name" name="2name" /><br />
        <label for="2email">Email: </label>
        <input type="email" id="2email" name="2email" /><br />
        <label for="2tel">Phone: </label>
        <input type="tel" id="2tel" name="2tel" /><br />
        <label for="carModel">Choose a Car:</label>
        <select name="carModel" id="carModel">
            <option value="model1">Model 1</option>
            <option value="model2">Model 2</option>
            <option value="model3">Model 3</option>
            <option value="model4">Model 4</option>
        </select><br>
        <label for="carColor">Choose a Car:</label>
        <select name="carColor" id="carColor">
            <option value="red">Red</option>
            <option value="green">Green</option>
            <option value="blue">Blue</option>
            <option value="black">Black</option>
        </select><br>
        <label for="quantity">Quantity: </label>
        <input type="number" name="quantity" id="quantity"><br />
        <label for="deliveryDate">Date:</label>
        <input type="date" name="deliveryDate" id="deliveryDate"><br />
        <button type="submit">Submit</button>
    </form>
</body>

</html>
